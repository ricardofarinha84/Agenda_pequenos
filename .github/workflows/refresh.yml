name: Atualizar eventos

on:
  schedule:
    # Todas as segundas-feiras às 7h UTC (8h Lisboa inverno / 8h verão com DST)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Permite correr manualmente em qualquer altura via GitHub → Actions → Run workflow

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necessário para fazer commit do eventos.json e fontes.json

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Correr o script de refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh.js

      - name: Commit e push dos resultados
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@agenda-porto"
          git add eventos.json fontes.json
          git diff --staged --quiet || git commit -m "🔄 Atualização automática $(date +'%Y-%m-%d')"
          git push
